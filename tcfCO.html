        }

        }

                const baseClass = idx % 2 === 0 ? "qt-fr" : "qt-cn";

                // 最后两行视为题干双语对（法语+中文）
                const isQuestionPair = total >= 2 && idx >= total - 2;

                p.className = baseClass + (isQuestionPair ? " qt-question" : "");
                p.textContent = line;

                questionTextEl.appendChild(p);
            });
        }


        function renderQuestion() {
            const exam = getCurrentExam();
            const q = exam.questions[currentQuestionIndex];
            const totalQuestions = exam.questions.length;

            questionNumberEl.textContent = `Question ${q.id} :`;
            progressTextEl.textContent = `${currentQuestionIndex + 1} / ${totalQuestions}`;

            // Audio
            if (q.audio) {
                audioPlayer.style.display = "";

                const fullUrl = new URL(q.audio, window.location.href).href;
                if (audioPlayer.src !== fullUrl) {
                    audioPlayer.src = q.audio;
                    audioPlayer.load();  // 重新加载新音频
                }

                audioPlayer.currentTime = 0;           // 从头开始
                audioPlayer.play().catch(() => {
                    // 如果浏览器因为自动播放策略阻止了，就静默忽略；
                    // 用户点一次播放之后，后面就都能自动播了。
                });
            } else {
                audioPlayer.style.display = "none";
            }

            renderQuestionText(q.text || "");

            // Choices
            choicesContainer.innerHTML = "";
            q.choices.forEach((choice, idx) => {
                const label = document.createElement("label");
                label.className = "choice";
                if (selectedAnswers[currentQuestionIndex] === idx) {
                    label.classList.add("selected");
                }

                const input = document.createElement("input");
                input.type = "radio";
                input.name = "choice";
                input.value = idx;

                input.addEventListener("change", () => {
                    selectedAnswers[currentQuestionIndex] = idx;
                    updateChoiceHighlight();
                    updateIndexStyles();
                });

                const spanLetter = document.createElement("span");
                spanLetter.className = "choice-label";
                spanLetter.textContent = choiceLetters[idx] + ".";

                const spanText = document.createElement("span");
                spanText.textContent = " " + choice;

                label.appendChild(input);
                label.appendChild(spanLetter);
                label.appendChild(spanText);
                choicesContainer.appendChild(label);
            });

            updateIndexStyles();

            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.disabled = currentQuestionIndex === totalQuestions - 1;
        }

        function updateChoiceHighlight() {
            const nodes = choicesContainer.querySelectorAll(".choice");
            nodes.forEach((node, idx) => {
                node.classList.toggle(
                    "selected",
                    selectedAnswers[currentQuestionIndex] === idx
                );
            });
        }

        /* ---------- QUESTION INDEX (1..N) ---------- */
        function buildQuestionIndexButtons() {
            indexGridEl.innerHTML = "";
            const exam = getCurrentExam();
            const totalQuestions = exam.questions.length;

            for (let i = 0; i < totalQuestions; i++) {
                const btn = document.createElement("button");
                btn.className = "index-btn";
                btn.textContent = i + 1;
                btn.dataset.index = i;
                btn.addEventListener("click", () => gotoQuestion(i));
                indexGridEl.appendChild(btn);
            }
            updateIndexStyles();
        }

        function gotoQuestion(index) {
            currentQuestionIndex = index;
            renderQuestion();
        }

        function updateIndexStyles() {
            const exam = getCurrentExam();
            const totalQuestions = exam.questions.length;
            const buttons = indexGridEl.querySelectorAll(".index-btn");

            buttons.forEach((btn, idx) => {
                if (idx >= totalQuestions) return;
                btn.classList.toggle("active", idx === currentQuestionIndex);
                btn.classList.toggle("answered", selectedAnswers[idx] !== null);
            });
        }

        function startExam(idx) {
            currentExamIndex = idx;
            currentQuestionIndex = 0;

            const exam = exams[idx];
            selectedAnswers = new Array(exam.questions.length).fill(null);

            examSelectScreen.style.display = "none";
            questionScreen.style.display = "block";
            indexSection.style.display = "block";
            backIcon.classList.remove("hidden");

            topbarTitle.textContent = `TCF - Compréhension orale - ${exam.label}`; // NEW

            buildQuestionIndexButtons();
            renderQuestion();
        }

        /* ---------- PREV / NEXT BUTTONS ---------- */
        prevBtn.addEventListener("click", () => {
            if (currentExamIndex === null) return;
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        });

        nextBtn.addEventListener("click", () => {
            if (currentExamIndex === null) return;
            const exam = getCurrentExam();
            if (currentQuestionIndex < exam.questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            }
        });

        /* ---------- INIT ---------- */
        buildExamGrid();
    </script>
</body>

</html>
