        }

        }

                    updateIndexStyles();
                });

                const spanLetter = document.createElement("span");
                spanLetter.className = "choice-label";
                spanLetter.textContent = choiceLetters[idx] + ".";

                const spanText = document.createElement("span");
                spanText.textContent = " " + choice;

                label.appendChild(input);
                label.appendChild(spanLetter);
                label.appendChild(spanText);
                choicesContainer.appendChild(label);
            });

            updateIndexStyles();

            prevBtn.disabled = currentQuestionIndex === 0;
            nextBtn.disabled = currentQuestionIndex === totalQuestions - 1;
        }

        function updateChoiceHighlight() {
            const nodes = choicesContainer.querySelectorAll(".choice");
            nodes.forEach((node, idx) => {
                node.classList.toggle(
                    "selected",
                    selectedAnswers[currentQuestionIndex] === idx
                );
            });
        }

        /* ---------- QUESTION INDEX (1..N) ---------- */
        function buildQuestionIndexButtons() {
            indexGridEl.innerHTML = "";
            const exam = getCurrentExam();
            const totalQuestions = exam.questions.length;

            for (let i = 0; i < totalQuestions; i++) {
                const btn = document.createElement("button");
                btn.className = "index-btn";
                btn.textContent = i + 1;
                btn.dataset.index = i;
                btn.addEventListener("click", () => gotoQuestion(i));
                indexGridEl.appendChild(btn);
            }
            updateIndexStyles();
        }

        function gotoQuestion(index) {
            currentQuestionIndex = index;
            renderQuestion();
        }

        function updateIndexStyles() {
            const exam = getCurrentExam();
            const totalQuestions = exam.questions.length;
            const buttons = indexGridEl.querySelectorAll(".index-btn");

            buttons.forEach((btn, idx) => {
                if (idx >= totalQuestions) return;
                btn.classList.toggle("active", idx === currentQuestionIndex);
                btn.classList.toggle("answered", selectedAnswers[idx] !== null);
            });
        }

        function startExam(idx) {
            currentExamIndex = idx;
            currentQuestionIndex = 0;

            const exam = exams[idx];
            selectedAnswers = new Array(exam.questions.length).fill(null);

            examSelectScreen.style.display = "none";
            questionScreen.style.display = "block";
            indexSection.style.display = "block";
            backIcon.classList.remove("hidden");

            topbarTitle.textContent = `TCF - Compréhension orale - ${exam.label}`; // NEW

            buildQuestionIndexButtons();
            renderQuestion();
        }

        /* ---------- PREV / NEXT BUTTONS ---------- */
        prevBtn.addEventListener("click", () => {
            if (currentExamIndex === null) return;
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                renderQuestion();
            }
        });

        nextBtn.addEventListener("click", () => {
            if (currentExamIndex === null) return;
            const exam = getCurrentExam();
            if (currentQuestionIndex < exam.questions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            }
        });

        /* ---------- INIT ---------- */
        buildExamGrid();
    </script>
</body>

</html>
